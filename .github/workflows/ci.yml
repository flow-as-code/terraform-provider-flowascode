# Build, vet, unit tests, generated-code drift and header checks. No AWS
# credentials here: the live acceptance lane is acceptance.yml (task B04i).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go run ./tools/headers
      - name: generated code is current
        run: |
          go generate ./...
          git diff --exit-code
      - run: go test ./...
